  </div>

<main class="bench">
  <div>
    <div id="stage">
      <canvas id="view"></canvas>
      <div class="dim"></div><div class="dim"></div><div class="dim"></div><div class="dim"></div>
      <div id="cropBox"></div>
      <div id="cover">

      <label class="check"><input type="checkbox" id="flipH"> <span data-t="orient.fh"></span></label>
      <label class="check"><input type="checkbox" id="flipV"> <span data-t="orient.fv"></span></label>
      <p class="hint" data-t="orient.hint"></p>

    <!-- 試験機能：入力の色。手の位置に円を描き、色はマウスの速さだけで決める -->

<script type="module">
import {
  Engine, Rate, render, cleanCrop, loadSettings, saveSettings, settingsToHash,
  tensionPercent, tiltSide, validRange, GLOW_START, orientFrame, mirrorRange,
  MouseMeter, palmOf, MOTION_TRAIL_MS, CAMERA_LAG_MS, DONATE_URL,
} from "./handlab.js";
import { openSource, listCameras } from "./source.js";
import { LANGS, setLang, getLang, t, applyI18n } from "./i18n.js";

const $ = (id) => document.getElementById(id);
const signed = (v, d = 0) => (v > 0 ? "+" : "") + Number(v).toFixed(d);
const settings = loadSettings();
const state = { angle: null, tension: null, running: false, source: null, switchTo: null };

/* ---------- 言語 ---------- */
// 言語を切り替えたときに出し直せるよう、状態で変わる文言は「キーと値」で覚えておく
const cover = { key: "cover.intro", vars: null };
const notes = new Map();  // id → [キー, 値]
function setCover(key, vars = null) { cover.key = key; cover.vars = vars; $("coverText").textContent = t(key, vars); }
function note(id, key, vars = null) {  // 映像の下に出す注意書き。key が空なら消す
  if (key) notes.set(id, [key, vars]); else notes.delete(id);
  $("notes").replaceChildren(...[...notes.values()].map(([k, v]) => {
    const el = document.createElement("div"); el.className = "notice"; el.textContent = t(k, v); return el;
  }));
}
function refreshTexts() {
  applyI18n();
  document.title = t("page.title");
  setCover(cover.key, cover.vars);
  note();
  cropTexts();
  const auto = $("camSel").querySelector('option[value=""]');
  if (auto) auto.textContent = t("cam.auto");
  persist();
  if (typeof motionTexts === "function") motionTexts();
}
for (const [code, name] of Object.entries(LANGS)) { const o = document.createElement("option"); o.value = code; o.textContent = name; $("langSel").append(o); }
$("langSel").value = setLang(settings.lang);
$("langSel").onchange = (e) => { settings.lang = setLang(e.target.value); refreshTexts(); };
// 見た目：既定は黒基調。最初の色は、ちらつかないよう <head> の中で先に決めている
$("themeSel").value = settings.theme === "light" ? "light" : "dark";
$("themeSel").onchange = (e) => { settings.theme = e.target.value; document.documentElement.dataset.theme = settings.theme; persist(); };

/* ---------- 計器 ---------- */
const SWEEP = 80;  // 針の振れ幅（度）。±100% がこの角度
const CX = 120, CY = 124, R = 100;
function buildDial() {
  const at = (pct, r) => { const a = (pct / 100) * SWEEP * Math.PI / 180; return [CX + r * Math.sin(a), CY - r * Math.cos(a)]; };
  const arc = (from, to, cls) => { const [x0, y0] = at(from, R), [x1, y1] = at(to, R); return `<path class="arc ${cls}" d="M${x0} ${y0}A${R} ${R} 0 0 1 ${x1} ${y1}"/>`; };
  let s = arc(-100, 100, "") + arc(-100, -GLOW_START, "hot") + arc(GLOW_START, 100, "hot");
  for (let p = -100; p <= 100; p += 10) {
    const major = p % 50 === 0, [x0, y0] = at(p, R - 2), [x1, y1] = at(p, R - (major ? 15 : 8));
    s += `<line class="tick ${major ? "" : "minor"}" x1="${x0}" y1="${y0}" x2="${x1}" y2="${y1}"/>`;
    if (major) { const [x, y] = at(p, R - 27); s += `<text x="${x}" y="${y + 4}">${p > 0 ? "+" : ""}${p}</text>`; }
  }
  s += `<g id="needle" class="idle selftest"><line x1="${CX}" y1="${CY}" x2="${CX}" y2="${CY - R + 12}"/><circle cx="${CX}" cy="${CY}" r="6"/></g>`;
  $("dial").innerHTML = s;
  $("needle").addEventListener("animationend", () => $("needle").classList.remove("selftest"));
}
function showDial(tension) {
  const needle = $("needle"), hot = tension != null && Math.abs(tension) > GLOW_START;
  $("stTension").textContent = tension == null ? "—" : signed(tension);
  $("readout").classList.toggle("hot", hot);
  if (needle.classList.contains("selftest")) return;  // 最初の一振りの間は針に触らない
  needle.classList.toggle("idle", tension == null);
  needle.classList.toggle("hot", hot);
  needle.style.transform = `rotate(${((tension || 0) / 100) * SWEEP}deg)`;
}
buildDial();

/* ---------- 設定の保存と、OBS 用の URL ---------- */
function persist() {
  saveSettings(settings);
  const url = new URL("overlay.html", location.href);
  url.search = "";
  url.hash = settingsToHash({ ...settings, lang: getLang() });  // OBS の中でも同じ言語で出るように、言語は必ず入れる
  $("obsUrl").value = url.href;
  $("m1s1").innerHTML = t("obs.m1.s1", { a: `<a href="${url.href.replace(/"/g, "&quot;")}" target="_blank" rel="noopener">`, z: "</a>" });
  const r = settings.range;
  $("stRange").textContent = r ? t("range.value", { min: signed(r.min), max: signed(r.max), neutral: signed(r.neutral) }) : t("range.unset");
  $("calibBtn").textContent = t(r ? "calib.again" : "calib.start");
  $("calibBtn").classList.toggle("primary", state.running && !r);  // 青いボタンは「次にやること」ひとつだけにする
}
$("skeleton").checked = settings.skeleton !== false;
$("gaugeOn").checked = settings.gauge !== false;
$("skeleton").onchange = (e) => { settings.skeleton = e.target.checked; persist(); };
$("gaugeOn").onchange = (e) => { settings.gauge = e.target.checked; persist(); };
/* 映像の向き：回してから裏返す。解析も描画も、向きを直した後の映像の上で行う */
const orientCanvas = document.createElement("canvas");
$("rotSel").value = String(settings.orient.rot);
$("flipH").checked = settings.orient.fh;
$("flipV").checked = settings.orient.fv;
$("rotSel").onchange = (e) => {
  settings.orient = { ...settings.orient, rot: Number(e.target.value) };
  settings.crop = { l: 0, t: 0, r: 0, b: 0 };  // 縦横が変わるので、映す範囲は全体に戻す
  placeBox(); persist();
};
// 裏返したら、映す範囲も同じ向きに裏返す。鏡像になると手首の角度の正負が逆になるので、可動域も入れ替える
const flip = (key, a, b) => (e) => {
  settings.orient = { ...settings.orient, [key]: e.target.checked };
  const c = settings.crop;
  settings.crop = { ...c, [a]: c[b], [b]: c[a] };
  settings.range = mirrorRange(settings.range);
  placeBox(); persist();
};
$("flipH").onchange = flip("fh", "l", "r");
$("flipV").onchange = flip("fv", "t", "b");
$("obsUrl").onfocus = (e) => e.target.select();
$("obsCopy").onclick = async () => {
  try { await navigator.clipboard.writeText($("obsUrl").value); } catch (e) { $("obsUrl").select(); document.execCommand("copy"); }
  $("obsCopy").textContent = t("copied");
  setTimeout(() => { $("obsCopy").textContent = t("copy"); }, 1500);
};

/* ---------- 映像の解析 ---------- */
const rate = new Rate(), hits = [];
function showStatus(res) {
  $("stFps").textContent = `${rate.fps.toFixed(1)} fps`;
  const now = performance.now();
  hits.push([now, res && res.points ? 1 : 0]);
  while (hits.length && hits[0][0] < now - 5000) hits.shift();
  $("stHit").textContent = `${(hits.reduce((a, h) => a + h[1], 0) / hits.length * 100).toFixed(0)} %`;
  $("stAngle").textContent = state.angle == null ? "—" : `${signed(state.angle, 1)}°`;
  showDial(state.tension);
}

async function refreshCameras() {
  const labels = await listCameras();
  const sel = $("camSel");
  sel.innerHTML = '<option value=""></option>';
  sel.firstChild.textContent = t("cam.auto");
  for (const label of labels) { const o = document.createElement("option"); o.value = o.textContent = label; sel.append(o); }
  sel.value = labels.includes(settings.camera) ? settings.camera : "";
}
$("camSel").onchange = (e) => { settings.camera = e.target.value; persist(); state.switchTo = e.target.value; };

async function start() {
  $("startBtn").disabled = true;
  let engine;
  try {
    engine = await Engine.create({ onProgress: (k) => k && setCover("cover." + k) });
  } catch (e) {
    setCover("cover.modelFail", { msg: e.message || e });
    $("startBtn").disabled = false;
    return;
  }
  setCover("cover.opening");
  try {
    state.source = await openSource(settings.camera);
  } catch (e) {
    if (e.name === "NotReadableError" || e.name === "AbortError") setCover("cover.noFrames", { name: e.name });
    else setCover("cover.denied", { detail: `${e.name || ""} ${e.message || e}`.trim() });
    $("startBtn").disabled = false;
    return;
  }
  $("cover").style.display = "none";
  $("stopBtn").style.display = "";
  $("stCam").textContent = state.source.label;
  if (state.source.kind === "camera") refreshCameras();
  note("delegate", engine.delegate === "CPU" ? "note.cpu" : "");
  state.running = true;
  motionTexts();
  persist();
  for (;;) {
    if (state.switchTo !== null) {  // カメラの切り替え
      const label = state.switchTo; state.switchTo = null;
      try { const next = await openSource(label); state.source.stop(); state.source = next; $("stCam").textContent = next.label; note("cam", ""); }
      catch (e) { note("cam", "note.camFail", { msg: e.message || e }); }
    }
    if (state.stop) {  // 「カメラを止める」：カメラを放して、最初の画面に戻る
      state.stop = false; state.running = false;
      if (document.pointerLockElement) document.exitPointerLock();
      motionTexts();
      state.source.stop(); state.source = null; state.angle = state.tension = null;
      $("cover").style.display = ""; $("stopBtn").style.display = "none"; $("startBtn").disabled = false;
      $("stCam").textContent = "—"; $("stAngle").textContent = "—";
      showDial(null);
      persist();
      setCover("cover.stopped");
      return;
    }
    const raw = await state.source.next();
    const frame = orientFrame(orientCanvas, raw.image, raw.width, raw.height, settings.orient);
    let res = null;
    try { res = await engine.analyze(frame.image, frame.width, frame.height); } catch (e) { /* 1 コマ失敗しても続ける */ }
    rate.tick();
    const range = settings.range;
    state.angle = res ? res.angle : null;
    state.tension = state.angle != null && range ? tensionPercent(state.angle, range) : null;
    const side = state.tension != null ? tiltSide(res.points[0], res.forearm, state.tension) : null;
    $("stage").style.setProperty("--ar", frame.width / frame.height);
    const motion = trackMotion(raw.t, res);
    // 操作画面では映像の全体を出す（OBS に映す範囲は、白い枠で示す）
    render($("view"), frame.image, frame.width, frame.height, res, { skeleton: settings.skeleton, tension: state.tension, side, motion });
    showStatus(res);
    $("stCam").title = state.source.info();
    if (raw.release) raw.release();
  }
}
$("startBtn").onclick = start;
$("stopBtn").onclick = () => { state.stop = true; };

/* ---------- 開発の寄付（フッターに小さく。受付ページの URL が無ければ出さない） ---------- */
if (DONATE_URL) {
  $("donateFootLink").href = DONATE_URL;
  $("donateFoot").hidden = false;
}

/* ---------- 入力の色（試験機能） ----------
   映像をクリックすると、このページがマウスを捕まえる（Esc で戻る）。捕まえている間だけ、マウスの動き（カウント）を読める。
   ゲームの最中は別のアプリがマウスを使っているので読めない（ゲーム中に使うにはアプリ版が要る）。 */
const meter = new MouseMeter();
const motion = { trail: [], prevT: null };
const local = ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
const devInput = local && new URLSearchParams(location.search).has("frames");  // 開発用：捕まえなくても読む（自動の確認のため）
const captured = () => document.pointerLockElement === $("stage") || devInput;
const moveEvent = "onpointerrawupdate" in window ? "pointerrawupdate" : "pointermove";  // 使えれば、間引かれない方
document.addEventListener(moveEvent, (e) => { if (settings.motion && captured()) meter.add(e.timeStamp, e.movementX, e.movementY); });
$("stage").addEventListener("click", async () => {
  if (!settings.motion || !state.running || $("stage").classList.contains("edit") || document.pointerLockElement) return;
  try { await $("stage").requestPointerLock({ unadjustedMovement: true }); }  // OS の加速を通さない動き（使えるブラウザなら）
  catch (e) { try { await $("stage").requestPointerLock(); } catch (e2) { /* 捕まえられなくても続ける */ } }
});
document.addEventListener("pointerlockchange", motionTexts);
function motionTexts() {
  $("motionState").textContent = !settings.motion ? "" : !state.running ? t("mo.needStart")
    : captured() ? t("mo.locked") : t("mo.click");
  $("stage").classList.toggle("grab", settings.motion && state.running && !captured());
}
/** 解析が終わったコマの、手の位置とマウスの速さを尾に足す。描く物（無ければ null）を返す。 */
function trackMotion(frameT, res) {
  if (!settings.motion || frameT == null) { motion.trail = []; motion.prevT = null; return null; }
  const t1 = frameT - CAMERA_LAG_MS, t0 = motion.prevT;  // 映像の遅れの分だけ前のマウスの動きと合わせる
  motion.prevT = t1;
  if (t0 == null || t1 <= t0) return null;
  const [dx, dy] = meter.sum(t0, t1);
  const v = Math.hypot(dx, dy) * (2.54 / (settings.dpi || 1600)) / ((t1 - t0) / 1000);  // cm/秒
  if (res && res.points) motion.trail.push({ t: frameT, ...palmOf(res.points), v });
  motion.trail = motion.trail.filter((m) => frameT - m.t <= MOTION_TRAIL_MS);
  return { trail: motion.trail, now: frameT };
}
$("motionOn").checked = !!settings.motion;
$("dpiIn").value = settings.dpi || 1600;
$("motionOn").onchange = (e) => {
  settings.motion = e.target.checked;
  if (!settings.motion && document.pointerLockElement) document.exitPointerLock();
  persist(); motionTexts();
};
$("dpiIn").onchange = (e) => {
  const v = Number(e.target.value);
  settings.dpi = v >= 100 && v <= 64000 ? v : 1600;
  e.target.value = settings.dpi; persist();
};

/* ---------- 可動域の測定：楽な構え（中立）→ 左右の限界まで往復（上限・下限） ---------- */
const CALIB = { ready: 3, neutral: 2, sweep: 9 };  // 各段階の秒数
let calib = null;
const pct = (sorted, p) => sorted[Math.min(sorted.length - 1, Math.max(0, Math.round(p * (sorted.length - 1))))];
function startCalib() {
  if (!state.running) { alert(t("calib.needStart")); return; }
  calib = { phase: "ready", until: performance.now() + CALIB.ready * 1000, neutral: [], sweep: [], result: null, text: null, sub: null };
  $("calibBox").style.display = ""; $("calibSave").style.display = "none"; $("calibRetry").style.display = "none"; $("calibBtn").style.display = "none";
}
function endCalib() { calib = null; $("calibBox").style.display = "none"; $("calibBtn").style.display = ""; }
function calibTick() {
  if (!calib) return;
  if (calib.phase === "done") {  // 結果の文言（言語を切り替えても出し直せるよう、毎回キーから作る）
    $("calibText").textContent = t(...calib.text); $("calibSub").textContent = t(...calib.sub);
    return;
  }
  const left = Math.max(0, (calib.until - performance.now()) / 1000), a = state.angle, s = Math.ceil(left);
  $("calibSub").textContent = a == null ? t("calib.nowNone") : t("calib.now", { a: signed(a, 1) });
  $("calibText").textContent = t("calib." + calib.phase, { s });
  if (calib.phase === "ready") {
    if (left <= 0) { calib.phase = "neutral"; calib.until = performance.now() + CALIB.neutral * 1000; }
  } else if (calib.phase === "neutral") {
    if (a != null) calib.neutral.push(a);
    if (left <= 0) { calib.phase = "sweep"; calib.until = performance.now() + CALIB.sweep * 1000; }
  } else if (calib.phase === "sweep") {
    if (a != null) calib.sweep.push(a);
    if (left <= 0) finishCalib();
  }
}
function finishCalib() {
  calib.phase = "done";
  $("calibRetry").style.display = "";
  const n = calib.neutral.slice().sort((x, y) => x - y), s = calib.sweep.slice().sort((x, y) => x - y);
  if (n.length < 5 || s.length < 25) { calib.text = ["calib.fail"]; calib.sub = ["calib.failSub"]; return; }
  // 一瞬の外れ値に引っ張られないよう、両端は上下 3% を除いた値を使う
  const r = { min: pct(s, 0.03), neutral: pct(n, 0.5), max: pct(s, 0.97) };
  const shown = { min: signed(r.min, 1), neutral: signed(r.neutral, 1), max: signed(r.max, 1) };
  if (!validRange(r)) { calib.text = ["calib.small", shown]; calib.sub = ["calib.smallSub"]; return; }
  calib.result = r;
  calib.text = ["calib.result", shown]; calib.sub = ["calib.resultSub"];
  $("calibSave").style.display = "";
}
$("calibBtn").onclick = startCalib;
$("calibRetry").onclick = startCalib;
$("calibCancel").onclick = endCalib;
$("calibSave").onclick = () => { settings.range = validRange(calib.result); persist(); endCalib(); };
setInterval(calibTick, 100);

/* ---------- OBS に映す範囲：角は 2 辺まとめて、辺は 1 辺だけ、枠の中は移動 ---------- */
const MIN_KEEP = 0.05;  // 残す最小の割合
const box = $("cropBox"), dims = document.querySelectorAll(".dim");
for (const k of ["l", "t", "r", "b", "nw", "ne", "sw", "se"]) { const h = document.createElement("div"); h.className = "hd " + k; h.dataset.k = k; box.append(h); }
function placeBox() {
  const c = settings.crop;
  box.style.left = c.l * 100 + "%"; box.style.top = c.t * 100 + "%"; box.style.right = c.r * 100 + "%"; box.style.bottom = c.b * 100 + "%";
  dims[0].style.cssText = `left:0;top:0;right:0;height:${c.t * 100}%`;
  dims[1].style.cssText = `left:0;bottom:0;right:0;height:${c.b * 100}%`;
  dims[2].style.cssText = `left:0;top:${c.t * 100}%;bottom:${c.b * 100}%;width:${c.l * 100}%`;
  dims[3].style.cssText = `right:0;top:${c.t * 100}%;bottom:${c.b * 100}%;width:${c.r * 100}%`;
}
function dragged(kind, start, dx, dy) {
  const c = { ...start }, lim = (v, max) => Math.min(Math.max(v, 0), max);
  if (kind !== "move") {
    if (kind.includes("w") || kind === "l") c.l = lim(start.l + dx, 1 - MIN_KEEP - start.r);
    if (kind.includes("e") || kind === "r") c.r = lim(start.r - dx, 1 - MIN_KEEP - start.l);
    if (kind.includes("n") || kind === "t") c.t = lim(start.t + dy, 1 - MIN_KEEP - start.b);
    if (kind.includes("s") || kind === "b") c.b = lim(start.b - dy, 1 - MIN_KEEP - start.t);
  } else {  // 枠ごと移動（大きさは変えない）
    const mx = lim(start.l + dx, start.l + start.r) - start.l, my = lim(start.t + dy, start.t + start.b) - start.t;
    c.l = start.l + mx; c.r = start.r - mx; c.t = start.t + my; c.b = start.b - my;
  }
  return c;
}
let drag = null;
box.addEventListener("pointerdown", (e) => {
  drag = { kind: e.target.dataset.k || "move", x: e.clientX, y: e.clientY, start: { ...settings.crop } };
  box.setPointerCapture(e.pointerId); e.preventDefault();
});
box.addEventListener("pointermove", (e) => {
  if (!drag) return;
  const r = $("stage").getBoundingClientRect();
  settings.crop = cleanCrop(dragged(drag.kind, drag.start, (e.clientX - drag.x) / r.width, (e.clientY - drag.y) / r.height));
  placeBox();
});
const endDrag = () => { if (drag) { drag = null; persist(); } };
box.addEventListener("pointerup", endDrag); box.addEventListener("pointercancel", endDrag);
function cropTexts() {
  const on = $("stage").classList.contains("edit");
  $("cropBtn").textContent = t(on ? "crop.done" : "crop.start");
  $("cropHint").textContent = t(on ? "crop.editHint" : "crop.hint");
  if (on) {
    const reset = document.createElement("button");
    reset.textContent = t("crop.reset"); reset.style.marginLeft = "8px"; reset.style.padding = "2px 10px";
    reset.onclick = () => { settings.crop = { l: 0, t: 0, r: 0, b: 0 }; placeBox(); persist(); };
    $("cropHint").append(reset);
  }
}
$("cropBtn").onclick = () => { $("stage").classList.toggle("edit"); cropTexts(); placeBox(); };
placeBox();

/* ---------- 始める ---------- */
refreshTexts();
showDial(null);
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) setCover("cover.needHttps");
// 開発用の入力（localhost だけ）のときは自動で始める
if (["localhost", "127.0.0.1", "[::1]"].includes(location.hostname) && new URLSearchParams(location.search).has("frames")) start();
</script>
